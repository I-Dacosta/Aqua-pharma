services:
  postgres:
    image: postgres:16-alpine
    container_name: intranet-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-platform}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-platform}"]
      interval: 5s
      timeout: 5s
      retries: 20
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    restart: unless-stopped
    volumes:
      - postgres-data:/var/lib/postgresql/data

  turbo-services:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.turbo-dev
    command: sh -lc "CI=true pnpm install && pnpm dev:services"
    container_name: intranet-turbo-services
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      CI: "true"
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-platform}
      DOCUMENT_SERVICE_PORT: ${DOCUMENT_SERVICE_PORT:-4003}
      ENTRA_CLIENT_ID: ${ENTRA_CLIENT_ID:-b73ebc2c-6176-4974-a486-da789c7ab544}
      ENTRA_CLIENT_SECRET: ${ENTRA_CLIENT_SECRET:-}
      ENTRA_POST_LOGOUT_REDIRECT_URI: ${ENTRA_POST_LOGOUT_REDIRECT_URI:-http://localhost:3000}
      ENTRA_REDIRECT_URI: ${ENTRA_REDIRECT_URI:-http://localhost:3000/api/auth/callback}
      ENTRA_TENANT_ID: ${ENTRA_TENANT_ID:-7797083b-78a3-41a0-8094-98bc772423be}
      GRAPH_SERVICE_PORT: ${GRAPH_SERVICE_PORT:-4001}
      GRAPH_SERVICE_URL: http://localhost:${GRAPH_SERVICE_PORT:-4001}
      CUSTOMER_SERVICE_PORT: ${CUSTOMER_SERVICE_PORT:-4002}
      CUSTOMER_SERVICE_URL: http://localhost:${CUSTOMER_SERVICE_PORT:-4002}
      DOCUMENT_SERVICE_URL: http://localhost:${DOCUMENT_SERVICE_PORT:-4003}
      NEXT_PUBLIC_CUSTOMER_SERVICE_URL: http://localhost:${CUSTOMER_SERVICE_PORT:-4002}
      NEXT_PUBLIC_DOCUMENT_SERVICE_URL: http://localhost:${DOCUMENT_SERVICE_PORT:-4003}
      NEXT_PUBLIC_ENTRA_CALLBACK_PATH: ${NEXT_PUBLIC_ENTRA_CALLBACK_PATH:-/api/auth/callback}
      NEXT_PUBLIC_ENTRA_CLIENT_ID: ${NEXT_PUBLIC_ENTRA_CLIENT_ID:-b73ebc2c-6176-4974-a486-da789c7ab544}
      NEXT_PUBLIC_ENTRA_TENANT_ID: ${NEXT_PUBLIC_ENTRA_TENANT_ID:-7797083b-78a3-41a0-8094-98bc772423be}
      NEXT_PUBLIC_GRAPH_SERVICE_URL: http://localhost:${GRAPH_SERVICE_PORT:-4001}
      POSTGRES_DB: ${POSTGRES_DB:-platform}
      POSTGRES_HOST: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
    ports:
      - "${GRAPH_SERVICE_PORT:-4001}:${GRAPH_SERVICE_PORT:-4001}"
      - "${CUSTOMER_SERVICE_PORT:-4002}:${CUSTOMER_SERVICE_PORT:-4002}"
      - "${DOCUMENT_SERVICE_PORT:-4003}:${DOCUMENT_SERVICE_PORT:-4003}"
    volumes:
      - ../..:/workspace
      - turbo-node-modules:/workspace/node_modules
      - turbo-pnpm-store:/pnpm/store
    working_dir: /workspace

  turbo-frontend:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.turbo-dev
    command: sh -lc "CI=true pnpm install && pnpm dev:frontend"
    container_name: intranet-turbo-frontend
    depends_on:
      turbo-services:
        condition: service_started
    environment:
      CI: "true"
      ENTRA_POST_LOGOUT_REDIRECT_URI: ${ENTRA_POST_LOGOUT_REDIRECT_URI:-http://localhost:${FRONTEND_INTERNAL_PORT:-3000}}
      ENTRA_REDIRECT_URI: ${ENTRA_REDIRECT_URI:-http://localhost:${FRONTEND_INTERNAL_PORT:-3000}/api/auth/callback}
      ENTRA_TENANT_ID: ${ENTRA_TENANT_ID:-7797083b-78a3-41a0-8094-98bc772423be}
      NEXT_PUBLIC_CUSTOMER_SERVICE_URL: http://localhost:${CUSTOMER_SERVICE_PORT:-4002}
      NEXT_PUBLIC_DOCUMENT_SERVICE_URL: http://localhost:${DOCUMENT_SERVICE_PORT:-4003}
      NEXT_PUBLIC_ENTRA_CALLBACK_PATH: ${NEXT_PUBLIC_ENTRA_CALLBACK_PATH:-/api/auth/callback}
      NEXT_PUBLIC_ENTRA_CLIENT_ID: ${NEXT_PUBLIC_ENTRA_CLIENT_ID:-b73ebc2c-6176-4974-a486-da789c7ab544}
      NEXT_PUBLIC_ENTRA_TENANT_ID: ${NEXT_PUBLIC_ENTRA_TENANT_ID:-7797083b-78a3-41a0-8094-98bc772423be}
      NEXT_PUBLIC_GRAPH_SERVICE_URL: http://localhost:${GRAPH_SERVICE_PORT:-4001}
    ports:
      - "${FRONTEND_INTERNAL_PORT:-3000}:3000"
      - "${FRONTEND_CUSTOMER_PORT:-3001}:3001"
    volumes:
      - ../..:/workspace
      - turbo-frontend-node-modules:/workspace/node_modules
      - turbo-frontend-pnpm-store:/pnpm/store
    working_dir: /workspace

volumes:
  postgres-data:
  turbo-frontend-node-modules:
  turbo-frontend-pnpm-store:
  turbo-node-modules:
  turbo-pnpm-store: